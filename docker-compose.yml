services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: seva
      POSTGRES_PASSWORD: seva_local
      POSTGRES_DB: seva_saathi
    ports:
      - "5433:5432"
    volumes:
      - seva_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seva -d seva_saathi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seva_pg_data:
